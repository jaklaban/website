<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ .Title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ "style.css" | relURL }}">
    <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">

</head>

<body>

    <header class="essay-header">

        <h1>
            <a href="{{ "/" | relURL }}">
                Philosophical Investigations
            </a>
        </h1>

    </header>

    <main class="essay">

        <h2>{{ .Title }}</h2>

        <p class="essay-date">
            {{ .Date.Format "January 2006" }}
        </p>

        <div class="essay-text">

            {{ .Content }}

        </div>

        <p class="back-link">
            <a href="/">← All writings</a>
        </p>

    </main>

    <footer>
        <p>© 2026, z.h.</p>
    </footer>

</body>

</html>
